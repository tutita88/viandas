<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Viandas</title>
<style>
:root{--bg:#faf8f4;--sf:#fff;--tx:#1f1d1a;--mu:#7a746b;--ac:#d9480f;--ac2:#fff;--bd:#e6e0d6;--ok:#2b8a3e;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#171513;--sf:#221f1c;--tx:#f2ede6;--mu:#a39b8f;--ac:#ff8a4c;--ac2:#1a1210;--bd:#38332d;--ok:#69db7c;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0 auto;max-width:640px;padding:calc(12px + env(safe-area-inset-top)) 14px 40px;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
h1{font-size:20px}h2{font-size:16px;margin:16px 0 8px}nav{display:flex;gap:6px;margin:8px 0}nav button{flex:1;padding:10px 2px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:10px;font-size:13px}nav .on{background:var(--ac);color:var(--ac2);font-weight:600}
.c{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}.r{display:flex;gap:8px;align-items:center;justify-content:space-between}.mu{color:var(--mu);font-size:13px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 10px}label{font-size:13px;color:var(--mu)}
.b{width:100%;padding:13px;border:0;border-radius:10px;background:var(--ac);color:var(--ac2);font-size:16px;font-weight:600}.s{width:auto;padding:6px 12px;font-size:13px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.o{display:flex;justify-content:space-between;padding:10px;border:1px solid var(--bd);border-radius:10px;margin-bottom:6px}.o.sel{outline:2px solid var(--ac);border-color:var(--ac)}.o.out{opacity:.4;pointer-events:none}
.t{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bd)}.big{font-size:24px;font-weight:700}.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.n{width:80px;margin:0}
</style></head><body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb=supabase.createClient("https://micupmevcowhujblrtrn.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1pY3VwbWV2Y293aHVqYmxydHJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MzA3MDQsImV4cCI6MjEwODAwNjcwNH0.TLPDU-E5lGcFamQaNkXCDrsGoFAcE4qxAD5aK3olEg0");
const $=s=>document.querySelector(s),B=document.body,esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),$$=n=>"$"+Math.round(n).toLocaleString("es-AR"),p2=n=>("0"+n).slice(-2),pad=n=>String(n).padStart(3,"0");
const ymd=d=>d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()),hm=s=>{const d=new Date(s);return p2(d.getHours())+":"+p2(d.getMinutes())};
const rng=d=>[new Date(d+"T00:00:00").toISOString(),new Date(new Date(d+"T00:00:00").getTime()+864e5).toISOString()];
const M=["Efectivo","Transferencia","Mercado Pago"],ST=["Pendiente","En preparación","Listo","Entregado"];
let sel={m:null,g:null},T="o",fD=ymd(new Date()),fC=fD,fP="todos",fS="todos",D=[];
function route(){location.hash=="#admin"?admin():cust()}addEventListener("hashchange",route);

/* ---------- CLIENTE ---------- */
async function cust(){
B.innerHTML=<h1>🍱 Hacé tu pedido</h1><div id="dl"></div><h2>Tus datos</h2><div class="c"><label>Cantidad</label><input id="q" type="number" min="1" value="1"><label>Nombre</label><input id="nm"><label>Domicilio</label><input id="ad"><label>Hora de entrega</label><input id="hr" type="time" value="12:30"><label>Forma de pago</label><select id="py">${M.map(m=><option>${m}</option>).join("")}</select><button class="b" onclick="send()">Confirmar pedido</button><p id="er" class="mu"></p></div>;
await dl();sb.channel("pub").on("postgres_changes",{event:"*",schema:"public",table:"dishes"},dl).subscribe()}
async function dl(){const{data}=await sb.from("dishes").select("*").eq("active",true).order("name");D=data||[];const el=$("#dl");if(!el)return;
const f=k=>D.filter(x=>x.kind==k).map(x=><div class="o ${x.stock<=0?"out":""} ${sel[k=="main"?"m":"g"]==x.id?"sel":""}" onclick="pk('${k=="main"?"m":"g"}',${x.id})"><span>${esc(x.name)}<br><span class="mu">${x.stock<=0?"Agotado":"Quedan "+x.stock}</span></span>${k=="main"?<b>${$$(x.price)}</b>:""}</div>).join("")||'<p class="mu">Sin opciones por hoy.</p>';
el.innerHTML="<h2>1. Plato principal</h2>"+f("main")+"<h2>2. Guarnición</h2>"+f("side")}
function pk(k,id){sel[k]=sel[k]==id&&k=="g"?null:id;dl()}
async function send(){const er=$("#er"),q=+$("#q").value,nm=$("#nm").value.trim(),ad=$("#ad").value.trim();
if(!sel.m)return er.textContent="Elegí un plato principal.";if(!(q>=1)||!nm||!ad)return er.textContent="Completá cantidad, nombre y domicilio.";
er.textContent="Enviando…";const{data,error}=await sb.rpc("place_order",{p_name:nm,p_addr:ad,p_time:$("#hr").value,p_pay:$("#py").value,p_main:sel.m,p_side:sel.g,p_qty:q});
if(error){er.textContent=error.message;return dl()}sel={m:null,g:null};
B.innerHTML=<h1>✔️ Pedido recibido</h1><div class="c"><div class="big">Comanda N° ${pad(data)}</div><p>Te esperamos para entregar a las ${esc($("#hr")?.value||"")}. Guardá este número.</p><button class="b" onclick="cust()">Hacer otro pedido</button></div>}

/* ---------- COCINA / ADMIN ---------- */
async function admin(){const{data:{session}}=await sb.auth.getSession();if(!session)return login();
B.innerHTML=<div class="r"><h1>Cocina</h1><button class="s" onclick="sb.auth.signOut().then(admin)">Salir</button></div><nav>${[["o","Comandas"],["m","Menú"],["j","Caja"],["i","Informes"]].map(x=><button data-t="${x[0]}" class="${T==x[0]?"on":""}" onclick="T='${x[0]}';admin()">${x[1]}</button>).join("")}</nav><div id="v"></div>;
await ({o:vOrd,m:vMenu,j:vCaja,i:vInf})[T]();
if(!window.rt)window.rt=sb.channel("adm").on("postgres_changes",{event:"*",schema:"public"},()=>{if(location.hash=="#admin"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))go()}).subscribe()}
async function go(){await ({o:vOrd,m:vMenu,j:vCaja,i:vInf})[T]()}
function login(){B.innerHTML=<h1>Ingreso cocina</h1><div class="c"><label>Email</label><input id="em" type="email"><label>Contraseña</label><input id="pw" type="password"><button class="b" onclick="doLogin()">Entrar</button><p id="er" class="mu"></p></div>}
async function doLogin(){const{error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});error?$("#er").textContent="Email o contraseña incorrectos.":admin()}
const V=h=>{const v=$("#v");if(v)v.innerHTML=h};

async function vOrd(){const[a,b]=rng(fD);const{data}=await sb.from("orders").select("*").gte("created_at",a).lt("created_at",b);let A=data||[];
const c=s=>A.filter(o=>o.status==s).length,due=A.filter(o=>!o.paid).reduce((x,o)=>x+o.total,0);
const L=A.filter(o=>(fP=="todos"||(fP=="pagados")==o.paid)&&(fS=="todos"||o.status==fS)).sort((x,y)=>x.delivery_time<y.delivery_time?-1:x.delivery_time>y.delivery_time?1:x.id-y.id);
V(<div class="c"><label>Día</label><input type="date" value="${fD}" onchange="fD=this.value||fD;go()"><div class="g"><div><label>Pago</label><select onchange="fP=this.value;go()">${[["todos","Todos"],["pagados","Pagados"],["sinpagar","Sin pagar"]].map(x=><option value="${x[0]}" ${fP==x[0]?"selected":""}>${x[1]}</option>).join("")}</select></div><div><label>Estado</label><select onchange="fS=this.value;go()"><option value="todos">Todos</option>${ST.map(x=><option ${fS==x?"selected":""}>${x}</option>`).join("")}</select></div></div></div>
<div class="g"><div class="c"><div class="mu">Comandas</div><div class="big">${A.length}</div></div><div class="c"><div class="mu">Por cobrar</div><div class="big">${$$(due)}</div></div></div>
<p class="mu">Pendientes <b>${c(ST[0])}</b> · En preparación <b>${c(ST[1])}</b> · Listas <b>${c(ST[2])}</b> · Entregadas <b>${c(ST[3])}</b></p>`+
L.map(o=>{const nx=ST[ST.indexOf(o.status)+1];return <div class="c" style="${o.status=="Entregado"?"opacity:.55":""}"><div class="r"><span class="big">N° ${pad(o.id)}</span><span><span class="t">${o.status}</span> <span class="t">${o.paid?"Pagado":"Sin pagar"}</span></span></div><div style="margin:6px 0"><b>${esc(o.main_name)}</b>${o.side_name?" + "+esc(o.side_name):""} <b>x${o.qty}</b></div><div class="mu">Ingresó ${hm(o.created_at)} · <b style="color:var(--tx)">Entregar ${esc(o.delivery_time)}</b></div><div class="mu">${esc(o.name)} · ${esc(o.addr)}</div><div class="mu">${esc(o.pay_method)} · ${$$(o.total)}</div><div class="r" style="justify-content:flex-start;margin-top:10px">${nx?<button class="s" onclick="adv(${o.id},'${nx}')">Pasar a: ${nx}</button>:""}<button class="s" onclick="payO(${o.id},${!o.paid})">${o.paid?"Marcar sin pagar":"Marcar pagado"}</button></div></div>}).join("")||'<p class="mu">No hay comandas con estos filtros.</p>')}
async function adv(id,s){await sb.from("orders").update({status:s}).eq("id",id);go()}
async function payO(id,v){const{data:o}=await sb.from("orders").select("*").eq("id",id).single();await sb.from("orders").update({paid:v}).eq("id",id);
if(v)await sb.from("cash").insert({type:"in",cat:"Cobro de pedido",concept:"Comanda N° "+pad(id)+" · "+o.name,amount:o.total,method:o.pay_method,order_id:id});else await sb.from("cash").delete().eq("order_id",id);go()}

async function vMenu(){const{data}=await sb.from("dishes").select("*").order("kind").order("name");
V(<div class="c"><b>Agregar plato</b><label>Nombre</label><input id="dn"><div class="g"><div><label>Tipo</label><select id="dk"><option value="main">Principal</option><option value="side">Guarnición</option></select></div><div><label>Precio</label><input id="dp" type="number" inputmode="decimal"></div></div><label>Stock inicial</label><input id="ds" type="number" value="0"><button class="b" onclick="addD()">Agregar</button></div>+
(data||[]).map(x=><div class="c" style="${x.active?"":"opacity:.55"}"><div class="r"><b>${esc(x.name)}</b><span class="t">${x.kind=="main"?"Principal":"Guarnición"}</span></div><div class="g"><div><label>Stock</label><input type="number" min="0" value="${x.stock}" onchange="upD(${x.id},{stock:Math.max(0,+this.value||0)})"></div><div><label>Precio</label><input type="number" value="${x.price}" onchange="upD(${x.id},{price:+this.value||0})"></div></div><label>Receta (ingrediente | cantidad | unidad)</label><textarea rows="2" onchange="upD(${x.id},{recipe:this.value})">${esc(x.recipe)}</textarea><div class="r" style="justify-content:flex-start"><button class="s" onclick="upD(${x.id},{active:${!x.active}})">${x.active?"Pausar":"Activar"}</button><button class="s" onclick="delD(${x.id})">Borrar</button></div></div>).join(""))}
async function addD(){const n=$("#dn").value.trim();if(!n)return;await sb.from("dishes").insert({name:n,kind:$("#dk").value,price:+$("#dp").value||0,stock:+$("#ds").value||0});go()}
async function upD(id,o){await sb.from("dishes").update(o).eq("id",id);if("active" in o)go()}
async function delD(id){if(confirm("¿Borrar este plato?")){await sb.from("dishes").delete().eq("id",id);go()}}

async function vCaja(){const[a,b]=rng(fC);const{data}=await sb.from("cash").select("*").gte("created_at",a).lt("created_at",b).order("id",{ascending:false});const E=data||[],s=(t,m)=>E.filter(x=>x.type==t&&(!m||x.method==m)).reduce((z,x)=>z+x.amount,0);
V(<div class="c"><label>Día</label><input type="date" value="${fC}" onchange="fC=this.value||fC;go()" style="margin:0"></div><div class="g"><div class="c"><div class="mu">Ingresos</div><div class="big" style="color:var(--ok)">${$$(s("in"))}</div></div><div class="c"><div class="mu">Egresos</div><div class="big" style="color:var(--ac)">${$$(s("out"))}</div></div></div><div class="c"><div class="r"><span>Saldo del día</span><span class="big">${$$(s("in")-s("out"))}</span></div>${M.map(m=><div class="r mu"><span>${m}</span><b>${$$(s("in",m)-s("out",m))}</b></div>`).join("")}</div>
<div class="c"><b>Registrar movimiento</b><label>Categoría</label><select id="cc"><optgroup label="Ingresos"><option value="in|Otro ingreso">Otro ingreso</option></optgroup><optgroup label="Egresos"><option value="out|Insumos">Insumos (compras)</option><option value="out|Gas y servicios">Gas y servicios</option><option value="out|Sueldos">Sueldos</option><option value="out|Packaging">Packaging</option><option value="out|Otro egreso">Otro egreso</option></optgroup></select><label>Concepto</label><input id="cn"><label>Monto</label><input id="ca" type="number" inputmode="decimal"><label>Medio</label><select id="cm">${M.map(m=><option>${m}</option>).join("")}</select><button class="b" onclick="addC()">Registrar</button></div><h2>Movimientos</h2>`+
E.map(x=><div class="c"><div class="r"><b>${esc(x.concept||x.cat)}</b><b style="color:${x.type=="in"?"var(--ok)":"var(--ac)"}">${x.type=="in"?"+":"−"}${$$(x.amount)}</b></div><div class="r mu"><span>${hm(x.created_at)} · ${esc(x.cat)} · ${esc(x.method)}</span><button class="s" onclick="delC(${x.id},${x.order_id||0})">Borrar</button></div></div>).join("")||'<p class="mu">Sin movimientos.</p>')}
async function addC(){const p=$("#cc").value.split("|"),a=+$("#ca").value;if(!(a>0))return;let d=new Date();if(fC!=ymd(d))d=new Date(fC+"T12:00:00");await sb.from("cash").insert({type:p[0],cat:p[1],concept:$("#cn").value.trim(),amount:a,method:$("#cm").value,created_at:d.toISOString()});go()}
async function delC(id,oid){if(!confirm("¿Borrar movimiento?"))return;if(oid)await sb.from("orders").update({paid:false}).eq("id",oid);await sb.from("cash").delete().eq("id",id);go()}

async function vInf(){const a=new Date(Date.now()-30*864e5).toISOString();const{data}=await sb.from("orders").select("*").gte("created_at",a);const O=data||[];
if(!O.length)return V('<p class="mu">Cuando entren pedidos vas a ver acá las estadísticas de los últimos 30 días.</p>');
const tot=O.reduce((x,o)=>x+o.total,0),grp=(f,w)=>{const r={};O.forEach(o=>r[f(o)]=(r[f(o)]||0)+w(o));return Object.entries(r).sort((x,y)=>y[1]-x[1]).slice(0,6)};
const li=(t,A,f)=><h2>${t}</h2><div class="c">${A.map(x=><div class="r"><span>${esc(x[0])}</span><b>${f(x[1])}</b></div>).join("")}</div>;
V(<p class="mu">Últimos 30 días</p><div class="g"><div class="c"><div class="mu">Ventas</div><div class="big">${$$(tot)}</div></div><div class="c"><div class="mu">Pedidos</div><div class="big">${O.length}</div></div></div><div class="c"><div class="mu">Ticket promedio</div><div class="big">${$$(tot/O.length)}</div></div>+li("Platos más pedidos",grp(o=>o.main_name,o=>o.qty),String)+li("Mejores clientes",grp(o=>o.name,o=>o.total),$$)+li("Formas de pago",grp(o=>o.pay_method,o=>1),String))}
route();
</script></body></html>
